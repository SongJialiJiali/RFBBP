[project]
name = "rfbbp"
version = "0.1.0"
description = "Bayesian correction for center-specific biomarker measurement relationships in survival analysis"
readme = "README.md"
authors = [
    { name = "SongJialiJiali", email = "1654934562@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arviz>=0.23.4",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pymc>=5.28.5",
    "pytensor>=2.38.3",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
]
